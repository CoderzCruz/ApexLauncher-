name: ApexLauncher Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download LTW renderer AAR
        run: |
          mkdir -p app_pojavlauncher/libs
          curl -fsSL --retry 4 --retry-delay 2 \
            -o app_pojavlauncher/libs/ltw-release.aar \
            https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      - name: Set up JDK 8 and JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            8
            17
          cache: gradle

      - name: Update language list
        run: |
          chmod +x scripts/languagelist_updater.sh scripts/fetch_and_repack_jres.sh gradlew
          bash scripts/languagelist_updater.sh

      - name: Build GLFW stub, Forge installer, and DNS injector
        run: |
          ./gradlew :jre_lwjgl3glfw:build :forge_installer:jar :arc_dns_injector:jar --no-daemon 2>&1 | tee /tmp/ci_step.log

      - name: Build lightweight APK (without bundled JREs)
        run: |
          set -o pipefail
          mkdir -p release_apks
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/ci_step.log
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk \
             release_apks/ApexLauncher-noruntime.apk

      - name: Fetch and repack OpenJDK 8, 17, and 21 runtimes
        env:
          PACK200_BIN: ${{ env.JAVA_HOME_8_X64 }}/bin/pack200
        run: |
          set -o pipefail
          ./scripts/fetch_and_repack_jres.sh 2>&1 | tee /tmp/ci_step.log

      - name: Build full ApexLauncher Abyssal Bioluminescent Ocean Glass APK
        run: |
          set -o pipefail
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/ci_step.log
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk \
             release_apks/ApexLauncher-AbyssalOceanGlass.apk
          cp release_apks/ApexLauncher-AbyssalOceanGlass.apk \
             release_apks/ApexLauncher-AuroraGlass.apk
          ls -lh release_apks/

      - name: Surface failure log in check summary
        if: failure()
        run: |
          if [[ -f /tmp/ci_step.log ]]; then
            while IFS= read -r errline; do
              echo "::error title=BuildDiagnostic::${errline}"
            done < <(grep -E "(error:|Error:|FAILED|Exception|Caused by:|What went wrong)" /tmp/ci_step.log | tail -n 15 || true)
            {
              echo "### Last 120 lines of build log"
              echo '```'
              tail -n 120 /tmp/ci_step.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload full APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexLauncher-AbyssalOceanGlass-APK
          path: release_apks/ApexLauncher-AbyssalOceanGlass.apk

      - name: Upload lightweight no-runtime APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexLauncher-NoRuntime-APK
          path: release_apks/ApexLauncher-noruntime.apk

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="abyssal-ocean-latest"
          SHORT_SHA="${GITHUB_SHA::7}"
          NOTES="Automated **ApexLauncher — UI #02: Abyssal Bioluminescent Ocean Glass** build from branch \`${GITHUB_REF_NAME}\` (commit \`${SHORT_SHA}\`).

          ### Direct APK Downloads
          - **ApexLauncher-AbyssalOceanGlass.apk** — Full ready-to-install APK including OpenJDK 8, 17, and 21 runtimes for all Minecraft versions.
          - **ApexLauncher-noruntime.apk** — Lightweight APK without bundled Java runtimes."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "ApexLauncher — Abyssal Bioluminescent Ocean Glass UI (${SHORT_SHA})" \
              --notes "$NOTES"
            gh release upload "$TAG" \
              release_apks/ApexLauncher-AbyssalOceanGlass.apk \
              release_apks/ApexLauncher-noruntime.apk \
              --clobber
          else
            gh release create "$TAG" \
              release_apks/ApexLauncher-AbyssalOceanGlass.apk \
              release_apks/ApexLauncher-noruntime.apk \
              --target "${GITHUB_SHA}" \
              --title "ApexLauncher — Abyssal Bioluminescent Ocean Glass UI (${SHORT_SHA})" \
              --notes "$NOTES"
          fi

          if gh release view "aurora-glass-latest" >/dev/null 2>&1; then
            gh release upload "aurora-glass-latest" \
              release_apks/ApexLauncher-AuroraGlass.apk \
              release_apks/ApexLauncher-noruntime.apk \
              --clobber
          fi
