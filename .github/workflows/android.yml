name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk2'
    types: [opened, reopened, synchronize]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk2'
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish the resulting APKs as a separate GitHub prerelease
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download LTW renderer
        run: |
          mkdir -p app_pojavlauncher/libs
          curl -fsSL --retry 4 --retry-delay 2 \
            -o app_pojavlauncher/libs/ltw-release.aar \
            https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      - name: Set up JDK 8 and 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
          cache: gradle

      - name: Update languages and build Java components
        run: |
          set -o pipefail
          chmod +x gradlew scripts/languagelist_updater.sh scripts/fetch_and_repack_jres.sh
          bash scripts/languagelist_updater.sh
          ./gradlew :jre_lwjgl3glfw:build :forge_installer:jar :arc_dns_injector:jar --no-daemon 2>&1 | tee /tmp/ci_step.log

      - name: Build APK without bundled runtimes
        run: |
          set -o pipefail
          mkdir -p release_apks
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/ci_step.log
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk release_apks/app-debug-noruntime.apk

      - name: Upload APK without runtimes
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-noruntime
          path: release_apks/app-debug-noruntime.apk
          if-no-files-found: error

      - name: Fetch and repack OpenJDK 8, 17, and 21 runtimes
        env:
          PACK200_BIN: ${{ env.JAVA_HOME_8_X64 }}/bin/pack200
        run: |
          set -o pipefail
          ./scripts/fetch_and_repack_jres.sh 2>&1 | tee /tmp/ci_step.log

      - name: Build full APK
        run: |
          set -o pipefail
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/ci_step.log
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk release_apks/app-debug.apk
          sha256sum release_apks/*.apk > release_apks/SHA256SUMS.txt

      - name: Upload full APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            release_apks/app-debug.apk
            release_apks/SHA256SUMS.txt
          if-no-files-found: error

      - name: Build Google Play app bundle
        if: github.repository_owner == 'PojavLauncherTeam' && github.ref_name == 'v3_openjdk'
        run: |
          ./gradlew :app_pojavlauncher:bundleGplay --no-daemon
          cp app_pojavlauncher/build/outputs/bundle/gplay/app_pojavlauncher-gplay.aab release_apks/app-gplay.aab

      - name: Upload Google Play app bundle
        if: github.repository_owner == 'PojavLauncherTeam' && github.ref_name == 'v3_openjdk'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: release_apks/app-gplay.aab
          if-no-files-found: error

      - name: Upload to the Google Play testing track
        if: github.repository_owner == 'PojavLauncherTeam' && github.ref_name == 'v3_openjdk'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1.1.2
        with:
          serviceAccountJsonPlainText: ${{ secrets.GPLAY_SERVICE_JSON }}
          packageName: net.kdt.pojavlaunch
          releaseFiles: release_apks/app-gplay.aab
          track: internal
          inAppUpdatePriority: 5

      - name: Surface build errors
        if: failure()
        run: |
          if [[ -f /tmp/ci_step.log ]]; then
            {
              echo '### Last 120 lines of build log'
              echo '```'
              tail -n 120 /tmp/ci_step.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  publish-preview:
    # Publish only when explicitly requested by dispatch or a marked push.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish_preview) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-apk]'))
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download full APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk/full

      - name: Download APK without runtimes
        uses: actions/download-artifact@v4
        with:
          name: app-debug-noruntime
          path: apk/noruntime

      - name: Publish a separate preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="preview-${GITHUB_SHA::8}-${GITHUB_RUN_ID}"
          NOTES="Debug build from commit \`${GITHUB_SHA}\` on branch \`${GITHUB_REF_NAME}\`.

          - app-debug.apk includes OpenJDK 8, 17, and 21 runtimes.
          - app-debug-noruntime.apk does not include Java runtimes."
          gh release create "$TAG" \
            apk/full/app-debug.apk apk/full/SHA256SUMS.txt apk/noruntime/app-debug-noruntime.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ApexLauncher preview (${GITHUB_SHA::8})" \
            --notes "$NOTES" --prerelease --latest=false
