name: ApexLauncher Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download LTW renderer AAR
        run: |
          mkdir -p app_pojavlauncher/libs
          curl -fsSL --retry 4 --retry-delay 2 \
            -o app_pojavlauncher/libs/ltw-release.aar \
            https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      - name: Set up JDK 8 and JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            8
            17
          cache: gradle

      - name: Update language list
        run: |
          chmod +x scripts/languagelist_updater.sh scripts/fetch_and_repack_jres.sh gradlew
          bash scripts/languagelist_updater.sh

      - name: Build GLFW stub, Forge installer, and DNS injector
        run: |
          ./gradlew :jre_lwjgl3glfw:build :forge_installer:jar :arc_dns_injector:jar --no-daemon

      - name: Build lightweight APK (without bundled JREs)
        run: |
          mkdir -p release_apks
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk \
             release_apks/ApexLauncher-noruntime.apk

      - name: Fetch and repack OpenJDK 8, 17, and 21 runtimes
        env:
          PACK200_BIN: ${{ env.JAVA_HOME_8_X64 }}/bin/pack200
        run: |
          ./scripts/fetch_and_repack_jres.sh

      - name: Build full ApexLauncher Aurora Glass APK
        run: |
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk \
             release_apks/ApexLauncher-AuroraGlass.apk
          ls -lh release_apks/

      - name: Upload full APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexLauncher-AuroraGlass-APK
          path: release_apks/ApexLauncher-AuroraGlass.apk

      - name: Upload lightweight no-runtime APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexLauncher-NoRuntime-APK
          path: release_apks/ApexLauncher-noruntime.apk

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="aurora-glass-latest"
          SHORT_SHA="${GITHUB_SHA::7}"
          NOTES="Automated **ApexLauncher — Aurora Glass Dashboard** build from branch \`${GITHUB_REF_NAME}\` (commit \`${SHORT_SHA}\`).

          ### Direct APK Downloads
          - **ApexLauncher-AuroraGlass.apk** — Full ready-to-install APK including OpenJDK 8, 17, and 21 runtimes for all Minecraft versions.
          - **ApexLauncher-noruntime.apk** — Lightweight APK without bundled Java runtimes."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "ApexLauncher — Aurora Glass Dashboard (${SHORT_SHA})" \
              --notes "$NOTES"
            gh release upload "$TAG" \
              release_apks/ApexLauncher-AuroraGlass.apk \
              release_apks/ApexLauncher-noruntime.apk \
              --clobber
          else
            gh release create "$TAG" \
              release_apks/ApexLauncher-AuroraGlass.apk \
              release_apks/ApexLauncher-noruntime.apk \
              --target "${GITHUB_SHA}" \
              --title "ApexLauncher — Aurora Glass Dashboard (${SHORT_SHA})" \
              --notes "$NOTES"
          fi
